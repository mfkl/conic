name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read SDK pin
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.pins.outputs.sdk }}
      - name: Test application and engine contracts
        run: ./eng/test.ps1 -Scope Core -Configuration '${{ matrix.configuration }}'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.configuration }}
          path: vlc-avalonia/artifacts/ci/Core/${{ matrix.configuration }}/*.trx
          if-no-files-found: warn
          retention-days: 14

  native_abi:
    name: Native ABI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read native pins
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "vlc_repository=$($pins.vlc.repository)" >> $env:GITHUB_OUTPUT
          "vlc_commit=$($pins.vlc.sourceCommit)" >> $env:GITHUB_OUTPUT
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - name: Checkout pinned VLC headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pins.outputs.vlc_repository }}
          ref: ${{ steps.pins.outputs.vlc_commit }}
          path: vlc
          persist-credentials: false
      - name: Compile and execute native layout probe
        run: ./eng/verify-native-abi.ps1 -VlcSourceRoot ../vlc
      - name: Upload native ABI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-abi-${{ matrix.os }}
          path: vlc-avalonia/artifacts/native-abi/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Full Windows / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read SDK pin
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.pins.outputs.sdk }}
      - name: Build, test and publish native plugin
        run: ./eng/test.ps1 -Scope Windows -Configuration '${{ matrix.configuration }}'
      - name: Exercise graphics diagnostic on hosted Windows
        if: matrix.configuration == 'Release'
        run: ./eng/test-graphics.ps1 -AllowUnavailable
      - name: Upload Windows graphics diagnostic
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphics-windows-2022
          path: vlc-avalonia/artifacts/graphics-ci/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows results and native plugin
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.configuration }}
          path: vlc-avalonia/artifacts/ci/Windows/${{ matrix.configuration }}/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: App / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read SDK pin
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.pins.outputs.sdk }}
      - name: Build app and run managed UI tests
        run: ./eng/test.ps1 -Scope Desktop -Configuration '${{ matrix.configuration }}'
      - name: Install Linux virtual display tools
        if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Release'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
      - name: Exercise graphics diagnostic on hosted Linux
        if: matrix.os == 'ubuntu-24.04' && matrix.configuration == 'Release'
        run: ./eng/test-graphics.ps1 -UseXvfb -AllowUnavailable
      - name: Exercise graphics diagnostic on hosted macOS
        if: matrix.os == 'macos-15' && matrix.configuration == 'Release'
        run: ./eng/test-graphics.ps1 -AllowUnavailable
      - name: Upload desktop graphics diagnostic
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphics-${{ matrix.os }}
          path: vlc-avalonia/artifacts/graphics-ci/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload app test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.configuration }}
          path: vlc-avalonia/artifacts/ci/Desktop/${{ matrix.configuration }}/*.trx
          if-no-files-found: warn
          retention-days: 14

  linux_engine:
    name: Linux engine / VLC 3 (no video output)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read SDK pin
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.pins.outputs.sdk }}
      - name: Install the distribution VLC 3 runtime and media tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvlccore9 libvlc5 vlc-plugin-base ffmpeg
      - name: Generate test media
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=duration=30:size=640x360:rate=25 \
            -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            "$RUNNER_TEMP/engine-smoke.mkv"
      - name: Engine queue, controls and lifecycle against real VLC
        run: ./eng/test-linux-engine.ps1 -Media "$env:RUNNER_TEMP/engine-smoke.mkv"
      - name: Upload Linux engine logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-engine
          path: vlc-avalonia/artifacts/linux-engine/*.log
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package / Windows x64
    # Push to main, version tags and manual runs; the ZIP is ~160 MB per run.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: vlc-avalonia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vlc-avalonia
          persist-credentials: false
      - name: Read SDK pin
        id: pins
        run: |
          $pins = Get-Content eng/versions.json -Raw | ConvertFrom-Json
          "sdk=$($pins.dotnetSdk)" >> $env:GITHUB_OUTPUT
          @{ sdk = @{ version = $pins.dotnetSdk; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.pins.outputs.sdk }}
      - name: Download pinned VLC runtime
        id: vlc
        run: |
          $runtime = ./eng/get-vlc.ps1 | Select-Object -Last 1
          "directory=$runtime" >> $env:GITHUB_OUTPUT
      - name: Build portable ZIP
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { "0.1.0-ci.$env:RUN_NUMBER" }
          ./eng/package.ps1 -VlcDirectory '${{ steps.vlc.outputs.directory }}' -Version $version -OutputDirectory artifacts/packages
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-win-x64
          path: |
            vlc-avalonia/artifacts/packages/*/*.zip
            vlc-avalonia/artifacts/packages/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-win-x64
          path: dist
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "VLC Avalonia $TAG" \
            --notes "Portable Windows x64 build with the official VLC 3.0.24 runtime. Extract the ZIP and run VLCAvalonia.exe. Verify the download with SHA256SUMS.txt." \
            $(find dist -type f)
