<?xml version="1.0" encoding="UTF-8"?>
<!-- macOS app icon: the app's two-tone cone (a cleaned-up redraw of VideoLAN's
     vlc/modules/gui/qt/pixmaps/misc/cone.svg in the redesign's Accent colours, the same
     cone as Assets/vlc-avalonia.ico) on a dark rounded square in Apple's icon grid
     (824 px body on a 1024 px canvas). AppIcon.icns and
     src/VLCAvalonia/Assets/vlc-avalonia-macos.png (512 px) are rendered from it with
     AppKit (NSImage reads SVG; it ignores the drop shadow filter).
     To rebuild AppIcon.icns on a Mac: render this file to AppIcon.iconset/icon_NxN.png
     and icon_NxN@2x.png for N = 16, 32, 128, 256 and 512, then run
     iconutil -c icns AppIcon.iconset -o eng/macos/AppIcon.icns -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <g transform="translate(512 512) scale(2.4) translate(-128 -128)">
    <path fill="#D37918" d="M128 160 V240 H26 Q20 240 21.69 234.24 L41.81 165.76 Q43.5 160 49.5 160 Z"/>
    <path fill="#AB6314" d="M128 160 H206.5 Q212.5 160 214.19 165.76 L234.31 234.24 Q236 240 230 240 H128 Z"/>
    <path fill="#FC9729" d="M128 16 A13.87 13.87 0 0 0 114.84 25.49 L70 160 A58 24.36 0 0 0 128 184.36 Z"/>
    <path fill="#D37918" d="M128 16 A13.87 13.87 0 0 1 141.16 25.49 L186 160 A58 24.36 0 0 1 128 184.36 Z"/>
    <path fill="#FFFFFF" d="M128 54.43 A20.67 6.43 0 0 1 107.33 48 L94 88 A34 11.9 0 0 0 128 99.9 Z"/>
    <path fill="#EFE5D9" d="M128 54.43 A20.67 6.43 0 0 0 148.67 48 L162 88 A34 11.9 0 0 1 128 99.9 Z"/>
    <path fill="#FFFFFF" d="M128 146.41 A47.33 18.41 0 0 1 80.67 128 L70 160 A58 24.36 0 0 0 128 184.36 Z"/>
    <path fill="#EFE5D9" d="M128 146.41 A47.33 18.41 0 0 0 175.33 128 L186 160 A58 24.36 0 0 1 128 184.36 Z"/>
  </g>
</svg>
